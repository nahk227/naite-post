<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>운영실 · 나이테 우체국</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0e1714; --panel:#16231e; --line:#2a3b34; --text:#efe6d8; --soft:#a99c89; --amber:#ffb84d; --red:#e0482f; --green:#4fc38f; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:'Noto Sans KR',system-ui,sans-serif; font-size:15px; line-height:1.6; }
    header { position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; padding:12px 20px; background:rgba(14,23,20,.92); border-bottom:1px solid var(--line); backdrop-filter:blur(8px); }
    h1 { font-family:'Black Han Sans'; font-weight:400; font-size:1.3rem; margin:0; }
    h2 { font-family:'Black Han Sans'; font-weight:400; font-size:1.15rem; margin:0 0 12px; display:flex; gap:8px; align-items:center; }
    main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; display:grid; gap:18px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; }
    .stat { background:rgba(255,255,255,.04); border-radius:12px; padding:12px; }
    .stat b { display:block; font-size:1.6rem; color:var(--amber); }
    .stat span { color:var(--soft); font-size:.82rem; }
    .stat.alert b { color:var(--red); }
    .item { border-top:1px solid var(--line); padding:12px 0; display:grid; gap:6px; }
    .item:first-of-type { border-top:0; }
    .meta { color:var(--soft); font-size:.8rem; }
    .body { font-family:'Gowun Batang',serif; background:#fffaf0; color:#2a211b; border-radius:8px; padding:10px 12px; white-space:pre-wrap; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    button, .btn { font:inherit; font-size:.85rem; cursor:pointer; border:0; border-radius:10px; padding:8px 12px; background:#2c3d36; color:var(--text); }
    button.ok { background:var(--green); color:#062015; font-weight:700; }
    button.warn { background:var(--red); color:#fff; font-weight:700; }
    button.amber { background:var(--amber); color:#2a1608; font-weight:700; }
    input, textarea { font:inherit; width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#0c1411; color:var(--text); }
    label { font-size:.82rem; color:var(--soft); display:block; margin:8px 0 4px; }
    .empty { color:var(--soft); }
    .badge { font-size:.72rem; padding:2px 8px; border-radius:999px; background:#2c3d36; }
    .login { max-width:380px; margin:12vh auto; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    @media (max-width:800px) { .grid2 { grid-template-columns:1fr; } }
    table { width:100%; border-collapse:collapse; font-size:.85rem; }
    td, th { text-align:left; padding:6px; border-bottom:1px solid var(--line); vertical-align:top; }
    .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#fffaf0; color:#2a211b; padding:10px 16px; border-radius:10px; font-weight:700; }
  </style>
</head>
<body>
  <header><h1>🌳 나이테 우체국 운영실</h1><div id="who" class="meta"></div></header>
  <main id="app"><p class="empty">불러오는 중…</p></main>
  <div id="toast" class="toast" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
